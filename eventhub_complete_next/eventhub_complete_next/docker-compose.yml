services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    environment:
      POSTGRES_DB: eventhub
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eventhub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub -d eventhub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://eventhub:eventhub_dev@postgres:5432/eventhub
      JWT_SECRET: ${EVENTHUB_JWT_SECRET:-eventhub-local-secret-change-me}
      ADMIN_EMAIL: admin@eventhub.local
      ADMIN_PASSWORD: ${EVENTHUB_ADMIN_PASSWORD:-Admin@123}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

  public-gateway:
    image: caddy:2-alpine
    profiles: ["public"]
    environment:
      EVENTHUB_GATE_USER: ${EVENTHUB_GATE_USER:-unset}
      EVENTHUB_GATE_HASH: ${EVENTHUB_GATE_HASH:-}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: tunnel --no-autoupdate --protocol http2 --url http://public-gateway:80
    depends_on:
      - public-gateway

volumes:
  eventhub_pg:
